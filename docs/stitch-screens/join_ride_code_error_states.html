<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "primary-container": "#ff7a1a", "tertiary-container": "#12ace6", "surface-bright": "#37393d", "on-primary": "#542200", "primary": "#ffb68e", "tertiary-fixed-dim": "#7bd0ff", "error-container": "#93000a", "inverse-surface": "#e2e2e6", "primary-fixed-dim": "#ffb68e", "on-primary-fixed": "#331200", "on-primary-container": "#5e2700", "surface-container-highest": "#333538", "surface-container": "#1e2023", "on-primary-fixed-variant": "#773300", "primary-fixed": "#ffdbca", "surface-variant": "#333538", "on-secondary": "#003824", "on-surface": "#e2e2e6", "on-surface-variant": "#e0c0b1", "on-tertiary-fixed-variant": "#004c69", "on-secondary-container": "#00311f", "outline-variant": "#584236", "surface-container-high": "#282a2d", "secondary-fixed-dim": "#4edea3", "inverse-primary": "#9c4500", "background": "#111317", "on-secondary-fixed-variant": "#005236", "surface-container-low": "#1a1c1f", "secondary": "#4edea3", "error": "#ffb4ab", "on-error-container": "#ffdad6", "surface-container-lowest": "#0c0e11", "inverse-on-surface": "#2f3034", "on-tertiary": "#00354a", "on-secondary-fixed": "#002113", "on-background": "#e2e2e6", "surface": "#111317", "on-error": "#690005", "outline": "#a78b7d", "surface-tint": "#ffb68e", "on-tertiary-fixed": "#001e2c", "secondary-fixed": "#6ffbbe", "on-tertiary-container": "#003c53", "surface-dim": "#111317", "tertiary": "#7bd0ff", "tertiary-fixed": "#c4e7ff", "secondary-container": "#00a572" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xs": "0.25rem", "space-sm": "0.5rem", "space-xl": "2rem", "space-md": "1rem", "space-lg": "1.5rem", "margin": "1.25rem", "gutter": "1rem" }, "fontFamily": { "headline-lg": ["Space Grotesk"], "display-telemetry": ["Space Grotesk"], "body-md": ["Inter"], "headline-sm": ["Space Grotesk"], "body-lg": ["Inter"], "label-caps": ["Space Grotesk"], "title-md": ["Inter"], "headline-md": ["Space Grotesk"], "label-numeric": ["Space Grotesk"] }, "fontSize": { "headline-lg": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "display-telemetry": ["56px", { "lineHeight": "60px", "letterSpacing": "-0.04em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "label-caps": ["11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "700" }], "title-md": ["16px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "600" }], "headline-md": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-numeric": ["18px", { "lineHeight": "22px", "letterSpacing": "0.02em", "fontWeight": "700" }] } } } };</script><style>
    body {

</head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-20 px-margin flex items-center justify-between"><button aria-label="Cancel or Go Back" class="w-16 h-16 rounded-xl flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[28px]">close</span></button><h1 class="font-headline-sm text-headline-sm uppercase tracking-wider text-on-surface select-none truncate text-center flex-1 px-space-sm">Join A Ride</h1><div class="flex items-center gap-space-xs"><button aria-label="Ride Pairing Help" class="w-16 h-16 rounded-xl flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container active:scale-95 transition-all" type="button"><span class="material-symbols-outlined text-[26px]">help_outline</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 ml-space-xs"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full px-margin pt-20 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-10 space-y-gutter">
<!-- Primary Error Diagnostic Card -->
<section aria-live="assertive" class="w-full rounded-[20px] bg-error-container/20 p-margin relative overflow-hidden shadow-xl" role="alert"><div class="flex flex-col items-center text-center py-space-sm"><div class="w-16 h-16 rounded-full bg-error-container/80 flex items-center justify-center text-error shadow-md mb-space-md"><span class="material-symbols-outlined text-[32px]">timer_off</span></div><div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-error/15 text-error text-label-caps uppercase tracking-wider mb-space-xs"><span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>Code Expired</div><h2 class="font-headline-md text-headline-md text-on-surface tracking-tight mt-1">Code Expired</h2><p class="font-body-md text-body-md text-on-surface-variant mt-space-xs leading-relaxed max-w-sm">This expedition code has expired. Please check with your ride leader for a new invite code.</p></div></section>
<!-- Input Failure Visualization (Glove Touch Target Grid) -->
<section class="w-full bg-surface-container rounded-[20px] p-margin shadow-md">
<div class="flex items-center justify-between mb-space-sm">
<label class="font-label-caps text-label-caps uppercase tracking-wider text-outline-variant">
        Entered Expedition Code
      </label>
<button class="inline-flex items-center gap-1 font-label-caps text-label-caps text-primary hover:text-primary-fixed active:scale-95 transition-all" id="btn-clear-code" type="button">
<span class="material-symbols-outlined text-[16px]">backspace</span>
        Clear &amp; Re-enter
      </button>
</div>
<!-- 6-character tactile input cells -->
<div class="grid grid-cols-6 gap-space-xs mb-space-sm" id="token-cells">
<div class="h-16 rounded-xl bg-error-container/25 flex items-center justify-center font-display-telemetry text-headline-md text-error shadow-inner">S</div>
<div class="h-16 rounded-xl bg-error-container/25 flex items-center justify-center font-display-telemetry text-headline-md text-error shadow-inner">P</div>
<div class="h-16 rounded-xl bg-error-container/25 flex items-center justify-center font-display-telemetry text-headline-md text-error shadow-inner">I</div>
<div class="h-16 rounded-xl bg-error-container/25 flex items-center justify-center font-display-telemetry text-headline-md text-error shadow-inner">9</div>
<div class="h-16 rounded-xl bg-error-container/25 flex items-center justify-center font-display-telemetry text-headline-md text-error shadow-inner">0</div>
<div class="h-16 rounded-xl bg-error-container/25 flex items-center justify-center font-display-telemetry text-headline-md text-error shadow-inner">4</div>
</div>
<!-- Validation Feedback Tooltip -->
<div class="flex items-center gap-space-xs text-error mt-space-xs bg-error-container/20 px-space-sm py-2 rounded-lg">
<span class="material-symbols-outlined text-[18px]">error</span>
<p class="font-body-md text-body-md font-medium text-on-error-container">Expired expedition code</p>
</div>
</section>
<!-- Scenario 2: Trip Found But Concluded / Archived -->

<!-- Troubleshooting & Alpine Fallback Mesh Systems -->

<!-- Kinetic Thumb-Zone Trigger Actions (Min 64dp Glove Operable) -->
<section class="w-full pt-space-xs space-y-space-sm">
<!-- Primary CTA: Try Another Code -->
<button class="w-full min-h-[64px] rounded-xl bg-primary-container text-on-primary-container active:scale-[0.98] transition-transform flex items-center justify-center gap-space-sm shadow-xl font-headline-sm text-headline-sm uppercase tracking-wider" id="btn-retry" type="button">
<span class="material-symbols-outlined text-[26px]">refresh</span>
<span>Try Another Code</span>
</button>
<!-- Secondary CTA: Scan QR Code -->
<button class="w-full min-h-[64px] rounded-xl bg-surface-container-highest text-on-surface active:scale-[0.98] transition-transform flex items-center justify-center gap-space-sm font-headline-sm text-headline-sm" type="button">
<span class="material-symbols-outlined text-[26px] text-primary">qr_code_scanner</span>
<span>Scan Pack QR Pass</span>
</button>
<!-- Dismiss & Return to Dashboard -->
<div class="w-full text-center pt-space-xs">
<button class="min-h-[48px] px-space-md inline-flex items-center justify-center font-label-caps text-label-caps uppercase text-outline hover:text-on-surface active:scale-95 transition-all" onclick="history.back()" type="button">
        Dismiss &amp; Return to Solo Ride Mode
      </button>
</div>
</section>
</div>
<script>
  // Immediate micro-interaction for rider code reset feedback
  document.getElementById('btn-clear-code')?.addEventListener('click', () => {
    const cells = document.querySelectorAll('#token-cells > div');
    cells.forEach((cell, idx) => {
      cell.classList.remove('bg-error-container/25', 'text-error');
      cell.classList.add('bg-surface-container-highest', 'text-outline-variant');
      cell.innerText = '_';
    });
  });

  document.getElementById('btn-retry')?.addEventListener('click', () => {
    const cells = document.querySelectorAll('#token-cells > div');
    cells.forEach((cell) => {
      cell.classList.add('animate-pulse');
      setTimeout(() => cell.classList.remove('animate-pulse'), 500);
    });
  });
</script></main>

</body></html>
