<script>
  // Glove-friendly tactile long-press feedback for emergency SOS
  (function initRideControls() {
    const sosBtn = document.getElementById('sosTrigger');
    if (!sosBtn) return;
    let pressTimer;

    sosBtn.addEventListener('touchstart', (e) => {
      sosBtn.classList.add('scale-95', 'brightness-125');
      pressTimer = setTimeout(() => {
        if (navigator.vibrate) navigator.vibrate([100, 50, 200]);
      }, 800);
    }, { passive: true });

    const clearPress = () => {
      sosBtn.classList.remove('scale-95', 'brightness-125');
      clearTimeout(pressTimer);
    };

    sosBtn.addEventListener('touchend', clearPress);
    sosBtn.addEventListener('touchcancel', clearPress);
  })();
