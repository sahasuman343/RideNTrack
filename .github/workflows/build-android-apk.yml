name: Build RideNTrack beta APK

# Two ways to build:
#   - Test build from any branch: Actions → this workflow → Run workflow →
#     pick the branch. Use it to try a pull request on a phone before merging.
#   - Beta release: push a tag like v1.0.0-beta.1 that points at main.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: read

concurrency:
  group: ridentrack-beta-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_tag:
    name: Check beta version tag and main-branch ancestry
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate beta tag format and release branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-beta[.][0-9]+$ ]]; then
            echo "::error::Expected a tag like v1.0.0-beta.1; got $RELEASE_TAG"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Beta tags must point to a commit already merged into main."
            exit 1
          fi

  validate:
    name: Run complete RideNTrack validation suite
    needs: check_tag
    # Tag builds must pass the tag check; branch test builds skip it.
    if: ${{ !cancelled() && (needs.check_tag.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.check_tag.result == 'skipped')) }}
    uses: ./.github/workflows/verify.yml

  build:
    name: Approved EAS APK build
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: apk-approval
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Name this build
        run: |
          # Tags name beta releases; branch builds get "<branch>-<commit>".
          # Slashes are not allowed in artifact names (feat/x -> feat-x).
          if [ "$GITHUB_REF_TYPE" = tag ]; then LABEL="$GITHUB_REF_NAME"; else LABEL="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"; fi
          echo "BUILD_LABEL=$(echo "$LABEL" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned EAS CLI
        run: npm install --global eas-cli@27.10.0
      - name: Start Android beta APK build on EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Configure EXPO_TOKEN as a GitHub Actions secret."
            exit 1
          fi
          eas build --platform android --profile preview --non-interactive --wait --verbose-logs --build-logger-level debug --json > "$RUNNER_TEMP/eas-build.json"
      - name: Download APK from this EAS build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="$(node -e "
            const fs = require('node:fs');
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eas-build.json', 'utf8'));
            const build = Array.isArray(value) ? value[0] : value;
            const id = build?.id ?? build?.build?.id;
            if (!id) throw new Error('EAS CLI did not return a build ID');
            process.stdout.write(id);
          ")"
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          eas build:download --build-id "$BUILD_ID" --json > "$RUNNER_TEMP/eas-download.json"
          APK_PATH="$(node -e "
            const fs = require('node:fs');
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eas-download.json', 'utf8'));
            if (!result.path) throw new Error('EAS CLI did not return the downloaded APK path');
            process.stdout.write(result.path);
          ")"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/RideNTrack-${BUILD_LABEL}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideNTrack-${{ env.BUILD_LABEL }}-APK
          path: RideNTrack-${{ env.BUILD_LABEL }}.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish build details
        if: always()
        run: |
          {
            echo "## RideNTrack APK"
            echo
            echo "- **${GITHUB_REF_TYPE^}:** \`${GITHUB_REF_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **EAS build ID:** \`${EAS_BUILD_ID:-not available}\`"
            echo "- **EAS profile:** \`preview\` (internal APK)"
            echo
            echo "Download the APK from this workflow run's **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"
