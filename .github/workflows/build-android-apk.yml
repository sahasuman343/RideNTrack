name: Build RideNTrack APK (main, live)

# Runs when a pull request is merged into main (every push to main).
# EAS profile "preview": the RideNTrack app with the live Supabase keys from
# the expo.dev "preview" environment.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ridentrack-main-apk
  cancel-in-progress: false

jobs:
  apk:
    uses: ./.github/workflows/_eas-android-apk.yml
    with:
      profile: preview
      lane: live (main)
      label_prefix: live
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
