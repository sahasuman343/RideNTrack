name: Supabase migrations (dev)
# Run by hand from the Actions tab ("Use workflow from" picks the branch whose
# migrations to use). With "apply" off it only shows which
# migrations are pending on RideNTrack-dev; with it on it applies them.
# Edge functions are not deployed here (deploy-dev-supabase.yml does that).
#
# Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DEV_DB_PASSWORD
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the pending migrations (off = only show them)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-dev-supabase
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: pblyvdrffiqauoqgfqjh
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DEV_DB_PASSWORD as repository secrets."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: ${{ inputs.apply && 'Apply pending migrations' || 'Show pending migrations' }}
        run: scripts/supabase-migrate.sh dev ${{ inputs.apply && 'apply' || 'plan' }}
