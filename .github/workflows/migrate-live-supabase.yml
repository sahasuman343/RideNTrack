name: Supabase migrations (live)
# Run by hand from the Actions tab. "Use workflow from" picks the branch whose
# migrations go live: main once PR 15 is merged, or the PR 15 branch before.
#   1. "plan" always runs first and shows what would change. It touches nothing.
#   2. With "apply" on, the "apply" job then waits for approval in the
#      supabase-live environment and applies the migrations to live.
# Take a backup first (docs/disaster-recovery.md).
#
# Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_LIVE_DB_PASSWORD
# Environment: supabase-live (add yourself as a required reviewer)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the pending migrations to LIVE after approval (off = only show them)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: migrate-live-supabase
  cancel-in-progress: false
env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_LIVE_DB_PASSWORD }}
  SUPABASE_PROJECT_REF: lpeaignvaesoeqeijrxe
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_LIVE_DB_PASSWORD as repository secrets."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Show pending migrations
        run: scripts/supabase-migrate.sh live plan
  apply:
    needs: plan
    if: inputs.apply
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: supabase-live
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Apply pending migrations to live
        run: scripts/supabase-migrate.sh live apply
