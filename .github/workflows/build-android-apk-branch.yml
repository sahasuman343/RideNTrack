name: Build test APK from a branch

# Build an installable preview APK from any branch, so a pull request can be
# tested on a phone before it is merged. Two ways to start it:
#   1. Add the label "build-apk" to a pull request. This works as soon as this
#      file is on the PR's branch. Remove and re-add the label to build again.
#   2. Actions tab → "Build test APK from a branch" → Run workflow → pick a
#      branch. GitHub only shows that button once this file is also on main.
# Both go through the same "apk-approval" environment and Expo "preview"
# environment as the tagged beta build.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ridentrack-test-apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Run complete RideNTrack validation suite
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-apk'
    uses: ./.github/workflows/verify.yml

  build:
    name: Approved EAS test APK build
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: apk-approval
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the branch being tested
        uses: actions/checkout@v4
        with:
          # For a labelled PR, build the branch itself, not GitHub's merge preview.
          ref: ${{ env.HEAD_SHA }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned EAS CLI
        run: npm install --global eas-cli@27.10.0
      - name: Start Android test APK build on EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Configure EXPO_TOKEN as a GitHub Actions secret."
            exit 1
          fi
          eas build --platform android --profile preview --non-interactive --wait \
            --message "Test build from $BRANCH (${HEAD_SHA::7})" \
            --json > "$RUNNER_TEMP/eas-build.json"
      - name: Download APK from this EAS build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="$(node -e "
            const fs = require('node:fs');
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eas-build.json', 'utf8'));
            const build = Array.isArray(value) ? value[0] : value;
            const id = build?.id ?? build?.build?.id;
            if (!id) throw new Error('EAS CLI did not return a build ID');
            process.stdout.write(id);
          ")"
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          eas build:download --build-id "$BUILD_ID" --json > "$RUNNER_TEMP/eas-download.json"
          APK_PATH="$(node -e "
            const fs = require('node:fs');
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eas-download.json', 'utf8'));
            if (!result.path) throw new Error('EAS CLI did not return the downloaded APK path');
            process.stdout.write(result.path);
          ")"
          SAFE_BRANCH="$(echo "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          echo "APK_NAME=RideNTrack-test-${SAFE_BRANCH}-${HEAD_SHA::7}" >> "$GITHUB_ENV"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/RideNTrack-test.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: RideNTrack-test.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish test build details
        if: always()
        run: |
          {
            echo "## RideNTrack test APK"
            echo
            echo "- **Branch:** \`${BRANCH}\`"
            echo "- **Commit:** \`${HEAD_SHA}\`"
            echo "- **EAS build ID:** \`${EAS_BUILD_ID:-not available}\`"
            echo "- **EAS profile:** \`preview\` (internal APK)"
            echo
            echo "Download the APK from this workflow run's **Artifacts** section. Not a release build."
          } >> "$GITHUB_STEP_SUMMARY"
