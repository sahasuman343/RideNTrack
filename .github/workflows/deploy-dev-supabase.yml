name: Deploy dev Supabase
# Applies supabase/migrations and deploys edge functions to the DEV project
# (RideNTrack-dev) only. The live project is never touched by this workflow.
#
# Needs two repository secrets:
#   SUPABASE_ACCESS_TOKEN     - personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DEV_DB_PASSWORD  - database password of RideNTrack-dev
on:
  push:
    branches: [dev, claude/project-thread-cjlw1z]
    paths: ['supabase/**', '.github/workflows/deploy-dev-supabase.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-dev-supabase
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      DEV_PROJECT_REF: pblyvdrffiqauoqgfqjh
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the secrets are added
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Dev Supabase secrets are not set yet; nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 2.122.1
      - name: Link the dev project
        if: steps.gate.outputs.ready == 'true'
        run: supabase link --project-ref "$DEV_PROJECT_REF"
      - name: Apply migrations
        if: steps.gate.outputs.ready == 'true'
        run: supabase db push --include-all
      - name: Deploy edge functions
        if: steps.gate.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$DEV_PROJECT_REF" --use-api
